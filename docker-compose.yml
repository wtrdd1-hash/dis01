services:
  app:
    image: discord-bot-app:latest
    pull_policy: never
    container_name: wtrdd-discord-app
    env_file:
      - ${PROD_DATA_ROOT:-.}/.env
    environment:
      NODE_ENV: production
      DB_HOST: 127.0.0.1
      TZ: Asia/Seoul
      NODE_OPTIONS: --max-old-space-size=768
    network_mode: host
    user: "1001:1001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777,noexec,nosuid,nodev
    volumes:
      - ${PROD_DATA_ROOT:-.}/backups:/app/backups
      - ${PROD_DATA_ROOT:-.}/uploads:/app/uploads
      - ${PROD_DATA_ROOT:-.}/logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 1g
    mem_reservation: 384m
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      autoheal: "4rue"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    profiles: ["app"]

  proxy:
    image: nginx:1.27-alpine
    container_name: wtrdd-edge-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${PROD_DATA_ROOT:-.}/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wtrdd-cloudflared
    command: tunnel --no-autoupdate run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - edge
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
    labels:
      autoheal: "true"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: wtrdd-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 20
      AUTOHEAL_START_PERIOD: 60
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge

  ddns:
    image: node:20-alpine
    container_name: wtrdd-ddns
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${PROD_DATA_ROOT:-.}/deploy/ddns/ddns_updater.js:/app/ddns_updater.js:ro
      - ${PROD_DATA_ROOT:-.}/logs:/app/logs
    environment:
      CF_ZONE_ID: ${CF_ZONE_ID:-cb1ef3b544bf2e403ff5e483215abe9e}
      CF_GLOBAL_API_KEY: ${CF_GLOBAL_API_KEY:-cfk_bpFG69e7XN1phfAIYe59QwqbqLdsr4dQnyvNxU0L1962aec3}
      CF_EMAIL: ${CF_EMAIL:-jungchwimisaenghwal63@gmail.com}
      DDNS_DOMAINS: "ssh.easy-scraping.com,mini.easy-scraping.com,direct.easy-scraping.com"
      DDNS_INTERVAL_MS: "10000"
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS:-886478189520637992,889085646768078850}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    command: ["node", "ddns_updater.js"]
    networks:
      - edge
    labels:
      autoheal: "true"

networks:
  edge:
    name: wtrdd-edge
    driver: bridge
