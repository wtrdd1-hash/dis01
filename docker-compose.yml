services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wtrdd-discord-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: 127.0.0.1
    network_mode: host
    user: "1001:1001"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    profiles: ["app"]

  proxy:
    image: nginx:1.27-alpine
    container_name: wtrdd-edge-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wtrdd-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - edge
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started

networks:
  edge:
    name: wtrdd-edge
    driver: bridge
