services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wtrdd-discord-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: 127.0.0.1
      TZ: Asia/Seoul
    network_mode: host
    user: "1001:1001"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./backups:/app/backups
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 20s
    labels:
      autoheal: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    profiles: ["app"]

  proxy:
    image: nginx:1.27-alpine
    container_name: wtrdd-edge-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wtrdd-cloudflared
    command: tunnel --no-autoupdate run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    networks:
      - edge
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
    labels:
      autoheal: "true"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: wtrdd-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 20
      AUTOHEAL_START_PERIOD: 60
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - edge

networks:
  edge:
    name: wtrdd-edge
    driver: bridge
