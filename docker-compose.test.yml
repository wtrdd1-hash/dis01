name: wtrdd-test

services:
  test-app:
    image: discord-bot-app:test-latest
    pull_policy: never
    container_name: wtrdd-test-app
    env_file:
      - ${TEST_DATA_ROOT:-.}/.env.runtime
    environment:
      NODE_ENV: test
      APP_ENV: test
      PROCESS_TYPE: web
      PORT: 8090
      TZ: Asia/Seoul
      NODE_OPTIONS: --max-old-space-size=512
      DISCORD_REDIRECT_URI: https://test.easy-scraping.com/auth/discord/callback
    network_mode: host
    user: "1000:1000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - ${TEST_DATA_ROOT:-.}/backups:/app/backups
      - ${TEST_DATA_ROOT:-.}/uploads:/app/uploads
      - ${TEST_DATA_ROOT:-.}/logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      autoheal: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
