<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1e1f22">
  <title>월덕 서비스 상태</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg-frame: #111214;
      --bg-tertiary: #1e1f22;
      --bg-secondary: #2b2d31;
      --bg-primary: #313338;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --text: #dbdee1;
      --text-header: #f2f3f5;
      --text-muted: #949ba4;
      --text-faint: #6d6f78;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --online: #23a559;
      --danger: #f23f42;
      --warn: #f0b232;
      --link: #00a8fc;
      --radius: 8px;
      --font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg-tertiary);
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
      word-break: keep-all;
    }
    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-frame);
      border-bottom: 1px solid rgba(0,0,0,.2);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-header); font-weight: 700; font-size: 14px;
    }
    .home-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--brand); color: #fff;
      display: grid; place-items: center; font-size: 13px; font-weight: 800;
    }
    .topbar a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; }
    .topbar a:hover { color: var(--text-header); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; }
    h1 { margin: 0 0 6px; font-size: 22px; color: var(--text-header); font-weight: 800; }
    .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; }
    .banner {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 16px;
    }
    .banner.ok { border-color: rgba(35,165,89,.45); }
    .banner.degraded { border-color: rgba(240,178,50,.45); }
    .banner.down { border-color: rgba(242,63,66,.5); }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
    .banner-title { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: var(--text-header); }
    .banner-sub { color: var(--text-muted); font-size: 13px; }
    .pill { font-size: 12px; color: var(--text-muted); }
    .grid { display: grid; grid-template-columns: 1.35fr .85fr; gap: 12px; }
    @media (max-width: 800px) { .grid, .banner { display: block; } .charts { margin-top: 12px; } }
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .row {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border-bottom: 1px solid var(--border-subtle);
    }
    .row:last-child { border-bottom: 0; }
    .name { font-weight: 700; color: var(--text-header); font-size: 14px; }
    .detail { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
    .badge {
      font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px;
      height: fit-content; letter-spacing: .04em;
    }
    .badge.ok { color: var(--online); background: rgba(35,165,89,.14); }
    .badge.degraded { color: var(--warn); background: rgba(240,178,50,.14); }
    .badge.down { color: var(--danger); background: rgba(242,63,66,.14); }
    .meta, .charts { padding: 14px; }
    .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: var(--text-muted); }
    .chart-title { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; font-weight: 700; }
    svg.spark { width: 100%; height: 72px; display: block; }
    .event { font-size: 12px; color: var(--text-muted); padding: 8px 14px; border-top: 1px solid var(--border-subtle); }
    .event b { color: var(--text); }
    .foot { margin-top: 18px; color: var(--text-faint); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; }
    .foot a { color: var(--link); text-decoration: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="home-mark">월</span> 월덕 상태</div>
    <div style="display:flex;gap:16px">
      <a href="https://easy-scraping.com">본 사이트</a>
      <a href="/ops">관리자</a>
    </div>
  </header>
  <div class="wrap">
    <h1>서비스 상태</h1>
    <div class="sub">웹·봇·DB·터널을 메인 앱과 분리된 감시 페이지에서 확인합니다. 본 앱이 꺼져 있어도 이 화면은 살아 있습니다.</div>
    <div class="banner" id="banner">
      <div style="display:flex;gap:12px;align-items:center">
        <div class="dot" id="dot"></div>
        <div>
          <p class="banner-title" id="overall">상태를 확인하는 중</p>
          <div class="banner-sub" id="overallSub">감시자와 Docker가 꺼진 서비스를 다시 켭니다.</div>
        </div>
      </div>
      <div class="pill" id="updated">불러오는 중</div>
    </div>
    <div class="grid">
      <div>
        <div class="card" id="checks"></div>
        <div class="card" id="events" style="margin-top:12px"></div>
      </div>
      <div>
        <div class="card charts">
          <p class="chart-title">24시간 업타임 <b id="u24">-</b></p>
          <svg class="spark" id="c24" viewBox="0 0 320 72" preserveAspectRatio="none"></svg>
          <p class="chart-title" style="margin-top:14px">7일 업타임 <b id="u7">-</b></p>
          <svg class="spark" id="c7" viewBox="0 0 320 72" preserveAspectRatio="none"></svg>
        </div>
        <div class="card meta" id="meta" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="foot">
      <span>이 페이지는 검색에 노출되지 않습니다.</span>
      <a href="/ops">관리자 콘솔</a>
    </div>
  </div>
  <script>
    const LEVEL_LABEL = { ok: '정상', degraded: '주의', down: '중단' };
    const OVERALL_TITLE = {
      ok: '모든 시스템이 정상입니다',
      degraded: '일부 구성 요소에 문제가 있습니다',
      down: '핵심 서비스가 내려간 상태입니다'
    };
    function fmtTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? iso : d.toLocaleString('ko-KR', { hour12: false });
    }
    function drawSpark(svg, points) {
      const w = 320, h = 72;
      if (!points || !points.length) {
        svg.innerHTML = '<text x="8" y="40" fill="#6d6f78" font-size="12">아직 이력이 쌓이는 중입니다</text>';
        return;
      }
      const minT = points[0].t, maxT = points[points.length - 1].t || minT + 1;
      const span = Math.max(1, maxT - minT);
      const coords = points.map((p) => {
        const x = ((p.t - minT) / span) * (w - 8) + 4;
        const y = h - 8 - (p.v / 2) * (h - 16);
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      const last = points[points.length - 1].v;
      const color = last >= 2 ? '#23a559' : last >= 1 ? '#f0b232' : '#f23f42';
      svg.innerHTML = '<polyline fill="none" stroke="' + color + '" stroke-width="2" points="' + coords.join(' ') + '"></polyline>';
    }
    function render(data) {
      const level = data.overall || 'down';
      const color = level === 'ok' ? '#23a559' : level === 'degraded' ? '#f0b232' : '#f23f42';
      document.getElementById('banner').className = 'banner ' + level;
      document.getElementById('dot').style.color = color;
      document.getElementById('overall').textContent = data.paused ? '감시자가 유지보수 모드입니다' : (OVERALL_TITLE[level] || OVERALL_TITLE.degraded);
      document.getElementById('overallSub').textContent = data.paused
        ? 'logs/watchdog/off 파일이 있어 자동 기동이 잠시 꺼져 있습니다.'
        : '문제 발생 시 Docker Autoheal과 호스트 감시자가 자동으로 다시 켭니다.';
      document.getElementById('updated').textContent = '갱신 ' + fmtTime(data.generatedAt);
      document.getElementById('checks').innerHTML = (data.checks || []).map((c) =>
        '<div class="row"><div><div class="name">' + c.name + '</div><div class="detail">' + (c.detail || '') + '</div></div><div class="badge ' + c.level + '">' + (LEVEL_LABEL[c.level] || c.level) + '</div></div>'
      ).join('');
      const host = data.host || {}, rec = data.recovery || {}, app = data.app || {}, hist = data.history || {};
      document.getElementById('u24').textContent = hist.uptime24h == null ? '-' : hist.uptime24h + '%';
      document.getElementById('u7').textContent = hist.uptime7d == null ? '-' : hist.uptime7d + '%';
      drawSpark(document.getElementById('c24'), hist.h24 || []);
      drawSpark(document.getElementById('c7'), hist.d7 || []);
      document.getElementById('meta').innerHTML =
        '<div class="kv"><span>앱 버전</span><b>' + (app.label || app.version || '-') + '</b></div>' +
        '<div class="kv"><span>24시간 복구</span><b>' + (rec.restarts24h || 0) + '회</b></div>' +
        '<div class="kv"><span>메모리</span><b>' + (host.memUsedPct == null ? '-' : host.memUsedPct + '%') + '</b></div>' +
        '<div class="kv"><span>디스크</span><b>' + (host.diskUsedPct == null ? '-' : host.diskUsedPct + '%') + '</b></div>' +
        '<div class="kv"><span>로드(1분)</span><b>' + (host.load1 == null ? '-' : host.load1) + '</b></div>';
      const events = data.events || [];
      document.getElementById('events').innerHTML = events.length
        ? events.slice(0, 8).map((ev) => '<div class="event"><b>' + (ev.action || '-') + '</b> · ' + (ev.reason || '') + ' · ' + fmtTime(ev.ts) + '</div>').join('')
        : '<div class="event">아직 복구 기록이 없습니다.</div>';
    }
    async function tick() {
      try {
        render(await (await fetch('/health.json', { cache: 'no-store' })).json());
      } catch (_) {
        document.getElementById('overall').textContent = '상태 페이지 응답이 없습니다';
        document.getElementById('banner').className = 'banner down';
      }
    }
    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
