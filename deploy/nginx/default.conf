# 5. 구 DNS / IP 직접 접속 / 미지정 도메인 전체 신규 테스트 서버로 301 영구 리다이렉트
server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://test.easy-scraping.com$request_uri;
    }
}

