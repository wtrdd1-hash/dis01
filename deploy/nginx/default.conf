map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 1. 월덕 디스코드 웹 (easy-scraping.com) - 시즌 2 준비 중 (접근 차단)
server {
    listen 80;
    server_name easy-scraping.com www.easy-scraping.com;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;

    location / {
        try_files /season2.html =503;
    }
}

# 2. NowPlayz 플래시 게임 아케이드 (nowplayz.com)
server {
    listen 80;
    server_name nowplayz.com www.nowplayz.com;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. 상태 관제 대시보드 (status.easy-scraping.com)
server {
    listen 80;
    server_name status.easy-scraping.com;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
